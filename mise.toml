# Tools and tasks for working on logistics: `mise install`, then `mise tasks`.
# Versions are the ones the current release was tested with.

[tools]
claude = "2.1.308"              # runs /feat and its agents
gh = "2.103.3"                  # phase 8 pushes and opens the PR; board tracking
"pypi:specify-cli" = "1.2.1"    # Spec Kit: `specify init` in each project
apm = "0.34.0"                  # installs the package (`apm install`, `mise run test:apm`)
node = "24.22.1"                # npx, for `install.sh deps` (skills CLI)
uv = "0.13.4"                   # backend for the pypi: tools
shellcheck = "0.11.0"           # lints install.sh, the scripts and their tests
actionlint = "1.7.12"           # lints .github/workflows
hugo-extended = "0.167.0"       # builds the documentation website
go = "1.27.1"                   # Hugo fetches its theme as a Go module
d2 = "0.9.0"                    # renders the diagrams in docs/img (`mise run diagrams`)

[tasks.lint]
description = "shellcheck the shell scripts and their tests, actionlint the workflows, grep the skills for the state-file wording state.sh replaced, grep both SKILL.md files for a size table or a gate table, both and harness.md for merge rules 2-6 and the base and repair check prose, harness.md and move.md for the Harness values step.sh replaced (step.sh applies those rules now), compile the Python test stub and measure.py (checked against Python 3.11), check sizes.tsv and the size tables' copies match sizes.json, validate the Claude Code plugin, check every agent denies Artifact and EnterWorktree"
run = [
  "shellcheck install.sh",
  "shellcheck .apm/skills/feat/scripts/*.sh",
  "shellcheck tests/tracker/run.sh tests/tracker/bin/gh",
  "shellcheck tests/spec-number/run.sh tests/spec-number/bin/gh",
  "shellcheck tests/secret-scan/run.sh .apm/skills/feat/scripts/secret-scan.sh",
  "shellcheck tests/story/run.sh",
  "shellcheck tests/state/run.sh tests/state/bin/gh",
  "shellcheck tests/step/run.sh",
  "shellcheck tests/ship/run.sh tests/ship/bin/gh",
  "shellcheck tests/sizes/run.sh",
  "shellcheck tests/measure/run.sh tests/measure/bin/*",
  "actionlint",
  "python3 -m py_compile tests/tracker/fake_github.py docs/diagrams/sizes.py .apm/skills/feat/scripts/measure.py",
  "python3 -c 'import ast, sys; [ast.parse(open(f).read(), feature_version=(3, 11)) for f in sys.argv[1:]]' .apm/skills/feat/scripts/measure.py docs/diagrams/sizes.py",
  "python3 -I docs/diagrams/sizes.py --check",
  "claude plugin validate .",
  "! grep -Eiq 'specifier|planner|tasker|spec\\.md|brief|phase [0-9]|/feat' .apm/skills/feat/references/harness.md .apm/skills/feat/references/rebase.md .apm/skills/feat/references/move.md",
  "! cat .apm/skills/feat/SKILL.md .apm/skills/fix/SKILL.md .apm/skills/feat/references/harness.md .apm/skills/feat/references/rebase.md .apm/agents/feat-shipper.agent.md | tr '\\n' ' ' | tr -s ' ' | grep -Eq 'after the last .back to|latest phase 2 line|latest .move — stayed on|latest .7 Code review. line|Edit it back|gh pr list --head|git grep -h|(write|set) .(Current phase|Size|Issue):|anything but the \\*state file\\*'",
  "! grep -Eq 'sizes-start|^\\| *Phase +\\| *Agent' .apm/skills/feat/SKILL.md .apm/skills/fix/SKILL.md",
  "! grep -Eiq 'first match wins|\\| *Report says *\\||\\| *Review and bug *\\||\\| *Size +\\| *Condition' .apm/skills/feat/SKILL.md .apm/skills/fix/SKILL.md",
  "! grep -Eiq 'reviewers disagree|same spot|no valid recommendation' .apm/skills/feat/SKILL.md .apm/skills/fix/SKILL.md .apm/skills/feat/references/harness.md",
  "! grep -Eq 'merge-base --is-ancestor|refs/logistics/pre-move|logistics-wip:' .apm/skills/feat/SKILL.md .apm/skills/fix/SKILL.md .apm/skills/feat/references/harness.md",
  "! grep -Eiq 'review phase|size triggers|logged gate commands|base-check boundaries|report keys|resume queries' .apm/skills/feat/references/harness.md .apm/skills/feat/references/move.md",
  "test \"$(wc -l < .apm/skills/tiny/SKILL.md)\" -le 200 || { echo '/tiny is over 200 lines: keep it tiny'; exit 1; }",
  '''bad=; for f in .apm/agents/*.agent.md; do l=$(grep -m1 "^disallowedTools:" "$f" | tr "," " "); for t in Artifact EnterWorktree; do case " $l " in *" $t "*) ;; *) echo "$f: disallowedTools lacks $t"; bad=1;; esac; done; done; test -z "$bad"''',
]

[tasks.check]
description = "Report what's missing to run /feat (pass a project dir to check Spec Kit too)"
run = "./install.sh check"

[tasks."test:apm"]
description = "Install this checkout with APM into a scratch dir for claude, and count what landed"
run = '''
#!/usr/bin/env bash
set -euo pipefail
repo="$PWD"
tmp="$(mktemp -d)"
trap 'rm -rf "$tmp"' EXIT
cd "$tmp" && git init -q
apm install "$repo" -t claude >/dev/null
for d in .claude/agents .claude/skills; do
  printf '%-18s %s\n' "$d" "$(ls "$d" | wc -l)"
done
test -f .claude/skills/feat/scripts/tracker.sh
test -f .claude/skills/feat/scripts/secret-scan.sh
test -f .claude/skills/feat/scripts/story.sh
test -f .claude/skills/feat/scripts/state.sh
test -f .claude/skills/feat/scripts/step.sh
test -f .claude/skills/feat/scripts/ship.sh
test -f .claude/skills/feat/scripts/measure.py
test -f .claude/skills/feat/sizes.json
test -f .claude/skills/feat/sizes.tsv
test -f .claude/skills/feat/references/harness.md
test -f .claude/skills/feat/references/rebase.md
test -f .claude/skills/feat/references/move.md
test -f .claude/skills/fix/SKILL.md
test -f .claude/skills/tiny/SKILL.md
'''

[tasks."test:tracker"]
description = "Run the board tracker script's offline tests (stub gh, fake GraphQL endpoint)"
run = "bash tests/tracker/run.sh"

[tasks."test:spec-number"]
description = "Run the spec-number script's offline tests (local git remote, stub gh)"
run = "bash tests/spec-number/run.sh"

[tasks.measure]
description = "Measure what /feat and /fix runs cost, from this machine's session transcripts (mise run measure -- --help)"
run = "python3 -I .apm/skills/feat/scripts/measure.py"
quiet = true

[tasks."test:measure"]
description = "Run measure.py's offline tests (synthetic transcripts, golden outputs)"
run = "bash tests/measure/run.sh"

[tasks."test:secret-scan"]
description = "Run the secret-scan script's offline tests (scratch git repos)"
run = "bash tests/secret-scan/run.sh"

[tasks."test:story"]
description = "Run the story script's offline tests (real and synthetic tasks.md fixtures)"
run = "bash tests/story/run.sh"

[tasks."test:state"]
description = "Run the state script's offline tests (fixture state files, golden outputs, scratch repos and worktrees, stub gh)"
run = "bash tests/state/run.sh"

[tasks."test:step"]
description = "Run the step script's offline tests (fixture state files and agent reports, golden outputs, scratch repos)"
run = "bash tests/step/run.sh"

[tasks."test:sizes"]
description = "Run sizes.py's offline tests (fixture sizes.json and stale copies, scratch roots)"
run = "bash tests/sizes/run.sh"

[tasks."test:ship"]
description = "Run the ship script's offline tests (a template repo and bare origin copied per case, stub gh, golden outputs)"
run = "bash tests/ship/run.sh"

[tasks.docs]
description = "Build the documentation website (README.md and docs/, see hugo.toml) into public/"
run = "hugo --gc --minify"

[tasks.diagrams]
description = "Regenerate the size tables' copies from .apm/skills/feat/sizes.json and render docs/diagrams to docs/img; lint and CI fail if they differ"
run = '''
#!/usr/bin/env bash
set -euo pipefail
python3 -I docs/diagrams/sizes.py
flags=(--pad 24 --theme 0 --dark-theme 200 --omit-version)
d2 "${flags[@]}" --sketch docs/diagrams/gates.d2 docs/img/gates.svg
d2 "${flags[@]}" --sketch --layout elk docs/diagrams/chain.d2 docs/img/chain.svg
python3 -I docs/diagrams/sizes.py --d2 | d2 "${flags[@]}" - docs/img/models.svg
'''

[tasks."docs:serve"]
description = "Serve the documentation website with live reload"
run = "hugo server"

[tasks."dev:install"]
description = "Symlink the skills and agents into ~/.claude and add the third-party skills (instead of APM)"
run = ["./install.sh", "./install.sh deps"]

[tasks."dev:uninstall"]
description = "Remove the symlinks dev:install created"
run = "./install.sh uninstall"
